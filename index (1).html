<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Cobro</title>
    <style>
        * { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #ff9f5e; padding: 20px; }
        .contenedor { display: flex; gap: 20px; max-width: 1100px; margin: 0 auto; }
        .columna { background: #fff; border-radius: 20px; padding: 25px; }
        .izquierda { flex: 1.2; }
        .derecha { flex: 1; }
        .platillo { display: flex; align-items: center; justify-content: space-between; margin: 15px 0; padding: 10px; border-bottom: 1px solid #eee; }
        .btn-suma { width: 40px; height: 40px; border-radius: 50%; background: #000; color: #fff; border: none; font-size: 22px; cursor: pointer; }
        .categorias { display: flex; gap: 10px; margin-top: 20px; }
        .cat { padding: 12px 25px; border: none; border-radius: 10px; background: #ff5c5c; color: white; font-size: 16px; cursor: pointer; }
        .factura-item { margin: 8px 0; display: flex; justify-content: space-between; }
        .total { margin-top: 15px; nt-size: 20px; font-weight: bold; }
        .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 25px; }
        .btn-verde { padding: 12px; border: none; border-radius: 10px; background: #2ecc71; color: white; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div class="contenedor">
    <!-- Columna Izquierda: Platillos -->
    <div class="columna izquierda">
        <div id="lista-platillos">
            <div class="platillo">
                <div>
                    <h4>Platillo 1</h4>
                    <p>$159.00</p>
                </div>
                <button class="btn-suma" onclick="agregar('Platillo 1', 159)">+</button>
            </div>
            <div class="platillo">
                <div>
                    <h4>Platillo 3</h4>
                    <p>$189.00</p>
                </div>
                <button class="btn-suma" onclick="agregar('Platillo 3', 189)">+</button>
            </div>
        </div>

        <div class="categorias">
            <button class="cat">Calientes</button>
            <button class="cat">Fríos</button>
            <button class="cat">Bebidas</button>
        </div>
    </div>

    <!-- Columna Derecha: Factura -->
    <div class="columna derecha">
        <h2 style="text-align:center; margin-bottom:20px;">Factura</h2>
        <div id="factura"></div>
        <div class="total">Total: $<span id="total">0</span></div>

        <div class="botones">
            <button class="btn-verde" onclick="guardar()">Guardar Cuenta</button>
            <button class="btn-verde">Imprimir Cuenta</button>
            <button class="btn-verde">Llamar Cuenta</button>
            <button class="btn-verde">Pagar</button>
        </div>
    </div>
</div>

<script>
// LÓGICA DE JAVASCRIPT
let total = 0;

function agregar(nombre, precio) {
    const factura = document.getElementById('factura');
    const item = document.createElement('div');
    item.className = 'factura-item';
    item.innerHTML = `<span>${nombre}</span><span>$${precio}</span>`;
    factura.appendChild(item);

    total += precio;
    document.getElementById('total').textContent = total;
}

function guardar() {
    // Enviar a PHP
    fetch('guardar.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'total=' + total
    })
    .then(res => res.text())
    .then(msj => alert(msj));
}
</script>

</body>
</html>
