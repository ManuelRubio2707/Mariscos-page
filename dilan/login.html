<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Mariscos Don Chuyita</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a237e, #4527a0);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .caja-login {
            background: #fff;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .caja-login h2 {
            text-align: center;
            color: #283593;
            margin-bottom: 30px;
        }
        .grupo {
            margin-bottom: 20px;
        }
        .grupo label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        .grupo input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }
        .btn-entrar {
            width: 100%;
            padding: 14px;
            background: #283593;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-entrar:hover {
            background: #1a237e;
        }
        .mensaje {
            margin-top: 15px;
            text-align: center;
            color: red;
        }
    </style>
</head>
<body>
    <div class="caja-login">
        <h2>🔐 Iniciar Sesión</h2>
        <form action="verificar_login.php" method="POST">
            <div class="grupo">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" required autocomplete="off">
            </div>
            <div class="grupo">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required>
            </div>
            <button type="submit" class="btn-entrar">Entrar</button>
        </form>
    </div>
</body>
</html>
